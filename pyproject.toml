[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-perspective"
version = "0.1.0"
description = "Perspective for Reflex: a WebAssembly analytics viewer (datagrid + WebGL charts) for large and streaming datasets, with client-only, server-only and replicated modes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = [
    "reflex",
    "reflex-custom-components",
    "perspective",
    "datagrid",
    "pivot",
    "streaming",
    "data-visualization",
    "webassembly",
]

dependencies = ["reflex>=0.9.12"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Reflex",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-perspective"
Source = "https://github.com/ecrespo/reflex-perspective"
Issues = "https://github.com/ecrespo/reflex-perspective/issues"
Perspective = "https://perspective-dev.github.io"

[project.optional-dependencies]
# Host tables in the Reflex backend (server-only and replicated modes).
# perspective-python 5.x ships cp311-abi3 wheels only, so this needs Python 3.11+.
server = ["perspective-python==5.5.1; python_version >= '3.11'"]
dev = [
    "build",
    "twine",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "perspective-python==5.5.1; python_version >= '3.11'",
]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
reflex_perspective = ["*.jsx", "*.pyi", "py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
    "perspective_demo/.web",
    "perspective_demo/.states",
    "assets",
    "*.pyi", # generated by `reflex component build`
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "C4", "PIE", "RUF", "S"]
ignore = [
    "E501",   # long lines are handled by the formatter; docstrings may exceed
    "RUF012", # Reflex components declare mutable class-level metadata
]
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"perspective_demo/**" = ["S311"] # demo data uses `random`, not for crypto

[tool.ruff.lint.isort]
known-first-party = ["reflex_perspective", "perspective_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
