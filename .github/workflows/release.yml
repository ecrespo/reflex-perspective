name: Release

# Push a version tag (e.g. `git tag v0.1.1 && git push origin v0.1.1`) to
# re-run every check, publish to PyPI with Trusted Publishing and create the
# GitHub release. The tag must match `version` in pyproject.toml.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/ci.yml

  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write

  build:
    name: Build distribution
    needs: [quality, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          py=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          mod=$(grep -m1 '^__version__' custom_components/reflex_perspective/__init__.py | cut -d'"' -f2)
          if [ "v$py" != "$TAG" ] || [ "$py" != "$mod" ]; then
            echo "::error::tag $TAG, pyproject $py and __version__ $mod must agree"
            exit 1
          fi
      - name: Build sdist + wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-perspective/
    permissions:
      id-token: write # Trusted Publishing (OIDC), no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" dist/*
          --title "reflex-perspective $TAG"
          --generate-notes
          --verify-tag
