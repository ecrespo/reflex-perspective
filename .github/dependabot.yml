version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # perspective-python moves in lockstep with the npm packages
    # (PERSPECTIVE_VERSION): upgrade both by hand, see
    # specs/runbooks/perspective-upgrade.md.
    ignore:
      - dependency-name: "perspective-python"
    groups:
      python:
        patterns: ["*"]
